[project]
name = "invexp-pose"
version = "0.1.0"
description = "Inference-only pose, gait-event and IMU comparison pipeline for InvExp"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are managed by the `pose` feature in ../../pixi.toml.
dependencies = []

[project.scripts]
invexp-pose = "invexp_pose.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invexp_pose"]
